<app-encabezado />
<main>
  <ul id="usuarios">
    @for (usuario2 of usuarios; track usuario2.id){
    <li>
      <app-usuario [Usuarios]="usuario2" (seleccion)="alSeleccionarUsuario($event)" />
    </li>

    }

  </ul>

  @if (nombreusuario()) {
    <app-tareas [nombreParaTarea]="nombreusuario()" />
  } @else {
    <p id="fallback">¡Selecciona un usuario para ver sus tareas!</p>
  }
</main>
